          - tsconfig.json
          - tsconfig.electron.json
          - playwright.config.ts
          - config/docs-capture/**
          - package.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - .nvmrc
          - jest.config.cjs
          - Dockerfile.app
          - .husky/pre-commit
          - .husky/pre-push
          - .github/workflows/**
          - scripts/docpact
          - scripts/docpact-gate.js
          - scripts/test-runner.cjs
          - scripts/jest-sequencer.cjs
          - scripts/oxlint-plugin-tiangong.mjs
          - scripts/typescript-native-parser.*
