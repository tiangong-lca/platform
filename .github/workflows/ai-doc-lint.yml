name: ai-doc-lint

on:
  push:
    branches:
      - dev
    paths:
      - .docpact/**
      - .github/workflows/ai-doc-lint.yml
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref for the manual docpact comparison.
        required: false
        default: origin/dev

permissions:
  contents: read

concurrency:
  group: ai-doc-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ai-doc-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cached docpact 0.1.9 binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/docpact
          key: docpact-bin-${{ runner.os }}-${{ runner.arch }}-0.1.9

      - name: Install docpact
        run: |
          if [ -x "$HOME/.cargo/bin/docpact" ] && [ "$("$HOME/.cargo/bin/docpact" --version)" = "docpact 0.1.9" ]; then
            echo "Using cached docpact 0.1.9"
          else
            cargo install docpact --version 0.1.9 --locked --force
          fi

      - name: Run local docpact gate
        if: ${{ github.event_name != 'push' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'origin/dev' }}
        run: pnpm docpact:gate --base "$BASE_REF"
