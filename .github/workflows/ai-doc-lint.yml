name: ai-doc-lint

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref for the manual docpact comparison.
        required: false
        default: origin/dev

permissions:
  contents: read

jobs:
  ai-doc-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install docpact
        run: cargo install docpact --version 0.1.9 --force

      - name: Run local docpact gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'origin/dev' }}
        run: pnpm docpact:gate --base "$BASE_REF"
