name: Dependency PR validation

on:
  pull_request:
    branches: [dev, main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - .npmrc
      - .nvmrc
      - .github/dependabot.yml
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-pr-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-gate:
    # Protected release phases already have an exact validation owner. Their
    # existing candidate checks validate every marker/lineage before success.
    if: >-
      github.event_name != 'pull_request' || !(
        (
          github.event.pull_request.base.ref == 'dev' &&
          contains(github.event.pull_request.body || '', 'tiangong-next-release-automation:v2')
        ) ||
        (
          github.event.pull_request.base.ref == 'main' &&
          (
            github.event.pull_request.head.ref == 'dev' ||
            startsWith(github.event.pull_request.head.ref, 'codex/promote-') ||
            startsWith(github.event.pull_request.head.ref, 'codex/hotfix-')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run canonical non-release gate
        env:
          TIANGONG_AGENT_MODE: '1'
          TIANGONG_TEST_LOG_DIR: .local/test-logs/dependency-pr-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm prepush:gate
      - name: Preserve complete test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-pr-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/test-logs/**
          if-no-files-found: ignore
          retention-days: 7

  action-compatibility:
    name: Action compatibility (non-release)
    # Match the ordinary dependency gate; protected release phases keep their owner.
    if: >-
      github.event_name != 'pull_request' || !(
        (
          github.event.pull_request.base.ref == 'dev' &&
          contains(github.event.pull_request.body || '', 'tiangong-next-release-automation:v2')
        ) ||
        (
          github.event.pull_request.base.ref == 'main' &&
          (
            github.event.pull_request.head.ref == 'dev' ||
            startsWith(github.event.pull_request.head.ref, 'codex/promote-') ||
            startsWith(github.event.pull_request.head.ref, 'codex/hotfix-')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact compatibility candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise setup-node without registry authentication
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify setup-node runtime before another action can replace it
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/qualification/action-compatibility-probe.cjs --stage setup-node --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/platform-actions-compatibility/setup-node.json"
      - name: Exercise pinned pnpm and runtime without installing the product
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: false
          install: false
      - name: Verify pnpm runtime and bind product inputs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/qualification/action-compatibility-probe.cjs --stage pnpm-setup --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/platform-actions-compatibility/pnpm-setup.json"
      - name: Upload exact tool compatibility receipts
        id: compatibility-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-actions-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-actions-compatibility/*.json
          archive: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify artifact service acknowledgement
        env:
          ARTIFACT_ID: ${{ steps.compatibility-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.compatibility-artifact.outputs.artifact-digest }}
        run: >-
          node scripts/qualification/action-compatibility-probe.cjs --stage artifact-upload --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  semantic-qualification:
    name: Supabase semantic qualification (non-release)
    needs: [dependency-gate, action-compatibility]
    if: >-
      always() && !cancelled() && (
        (
          (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !(
        (
          github.event.pull_request.base.ref == 'dev' &&
          contains(github.event.pull_request.body || '', 'tiangong-next-release-automation:v2')
        ) ||
        (
          github.event.pull_request.base.ref == 'main' &&
          (
            github.event.pull_request.head.ref == 'dev' ||
            startsWith(github.event.pull_request.head.ref, 'codex/promote-') ||
            startsWith(github.event.pull_request.head.ref, 'codex/hotfix-')
          )
        )
      ))) &&
          needs.dependency-gate.result == 'success' &&
          needs.action-compatibility.result == 'success'
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          startsWith(github.event.pull_request.head.ref, 'codex/hotfix-') &&
          contains(github.event.pull_request.body || '', 'tiangong-next-main-semantic:v1') &&
          needs.dependency-gate.result == 'skipped' &&
          needs.action-compatibility.result == 'skipped'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact browser candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false
      - name: Admit exact ordinary or opted-in Main hotfix candidate
        env:
          DEPENDENCY_GATE_RESULT: ${{ needs.dependency-gate.result }}
          ACTION_COMPATIBILITY_RESULT: ${{ needs.action-compatibility.result }}
        run: >-
          node scripts/qualification/hotfix-semantic-admission.cjs --event-path "$GITHUB_EVENT_PATH" --expected-head "$EXPECTED_HEAD" --github-output "$GITHUB_OUTPUT"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Bind runner capacity and start owned resource observation
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/platform-supabase-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'QUALIFICATION_STATE=%s\n' "$state" >> "$GITHUB_ENV"
          node scripts/qualification/supabase-browser-resources.cjs start --root "$GITHUB_WORKSPACE" --state "$state" --head "$EXPECTED_HEAD"
      - name: Run unchanged complete canonical qualification
        run: >-
          pnpm --silent e2e:qualify --proof .local/e2e-release/qualification-proof.json --format=json --output .local/e2e-release/qualification-controller-report.json
      - name: Verify canonical generated qualification proof
        run: >-
          pnpm --silent release:proof:verify --proof .local/e2e-release/qualification-proof.json --format=json
      - name: Recover only exact owned resources and record retained capacity
        if: always() && env.QUALIFICATION_STATE != ''
        run: >-
          node scripts/qualification/supabase-browser-resources.cjs finish --root "$GITHUB_WORKSPACE" --state "$QUALIFICATION_STATE" --head "$EXPECTED_HEAD"
      - name: Require independently verified resource closure
        if: always() && env.QUALIFICATION_STATE != ''
        run: >-
          node scripts/qualification/supabase-browser-resources.cjs verify --root "$GITHUB_WORKSPACE" --state "$QUALIFICATION_STATE" --head "$EXPECTED_HEAD"
      - name: Upload synthetic qualification and cleanup evidence
        if: always()
        id: semantic-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-supabase-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-supabase-browser-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            .local/e2e-release/qualification-proof.json
            .local/e2e-release/qualification-controller-report.json
            .local/e2e-release/runs/**/run-result.json
            .local/e2e-release/runs/**/preflight-report.json
            .local/e2e-release/runs/**/semantic-harness-qualification.json
            .local/e2e-release/runs/**/qualification-evidence-roundtrip.json
            .local/e2e-release/runs/**/mobile-navigation-diagnostic.json
          archive: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify artifact service acknowledgement
        if: always() && steps.semantic-artifact.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.semantic-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.semantic-artifact.outputs.artifact-digest }}
        run: >-
          node scripts/qualification/action-compatibility-probe.cjs --stage artifact-upload --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
