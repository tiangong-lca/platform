name: I18n semantic E2E

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or commit to qualify; defaults to the dispatched commit.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: i18n-semantic-e2e-manual-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-qualification:
    name: Manual Hermetic Semantic Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve qualification proof key
        id: qualification-identity
        run: |
          set -euo pipefail
          identity_json="$(pnpm --silent e2e:qualification:key --format=json)"
          proof_key="$(jq -r '.result.proofKey' <<< "$identity_json")"
          if [[ ! "$proof_key" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Qualification identity did not return a valid proof key."
            exit 1
          fi
          echo "proof_key=$proof_key" >> "$GITHUB_OUTPUT"

      - name: Run complete semantic qualification
        run: >-
          pnpm --silent e2e:qualify --proof .local/e2e-release/qualification-proof.json --format=json --output .local/e2e-release/qualification-controller-report.json

      - name: Verify generated qualification proof
        run: >-
          pnpm --silent release:proof:verify --proof .local/e2e-release/qualification-proof.json --format=json

      - name: Upload manual semantic qualification proof
        uses: actions/upload-artifact@v7
        with:
          name: manual-semantic-qualification-${{ steps.qualification-identity.outputs.proof_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/e2e-release/qualification-proof.json
            .local/e2e-release/qualification-controller-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-qualification-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/e2e-release/qualification-controller-report.json
            .local/e2e-release/runs/**/run-result.json
            .local/e2e-release/runs/**/preflight-report.json
            .local/e2e-release/runs/**/semantic-harness-qualification.json
            .local/e2e-release/runs/**/qualification-evidence-roundtrip.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
