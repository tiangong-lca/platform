name: Release Readiness

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release-readiness-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-candidate-context:
    name: Release Candidate Context
    if: >-
      github.event.pull_request.base.ref == 'dev' && contains(github.event.pull_request.body || '', 'tiangong-next-release-automation:v2')
    runs-on: ubuntu-latest
    outputs:
      release_base: ${{ steps.context.outputs.release_base }}
      candidate_base: ${{ steps.context.outputs.candidate_base }}
      release_head: ${{ steps.context.outputs.release_head }}
      release_version: ${{ steps.context.outputs.release_version }}
      proof_pr_number: ${{ steps.context.outputs.proof_pr_number }}

    steps:
      - name: Check out exact Release PR candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Verify deterministic Release PR identity
        id: context
        run: >-
          node scripts/release/release-gate-proof.cjs candidate-context --event-path "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"

  release-candidate:
    name: Release Candidate
    needs: release-candidate-context
    uses: ./.github/workflows/release-gate.yml
    with:
      release_base: ${{ needs.release-candidate-context.outputs.release_base }}
      candidate_base: ${{ needs.release-candidate-context.outputs.candidate_base }}
      release_head: ${{ needs.release-candidate-context.outputs.release_head }}
      release_version: ${{ needs.release-candidate-context.outputs.release_version }}
      emit_proof: true
      proof_pr_number: ${{ needs.release-candidate-context.outputs.proof_pr_number }}

  main-candidate:
    name: Main Candidate / Release Gate
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Resolve exact main candidate gate
        id: context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/release/release-gate-proof.cjs main-candidate-context --repository "$GITHUB_REPOSITORY" --event-path "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"

      - name: Install stable Rust toolchain
        if: steps.context.outputs.gate_mode == 'hotfix-full'
        uses: dtolnay/rust-toolchain@stable

      - name: Install docpact
        if: steps.context.outputs.gate_mode == 'hotfix-full'
        run: cargo install docpact --version 0.1.9 --force

      - name: Install dependencies
        if: steps.context.outputs.gate_mode == 'hotfix-full'
        run: pnpm install --frozen-lockfile

      - name: Verify reviewed LCIA cache bundle
        if: steps.context.outputs.gate_mode == 'hotfix-full'
        run: pnpm lcia-cache:verify

      - name: Run docpact hotfix gate
        if: steps.context.outputs.gate_mode == 'hotfix-full'
        env:
          RELEASE_BASE: ${{ steps.context.outputs.release_base }}
          RELEASE_HEAD: ${{ steps.context.outputs.promotion_head }}
        run: pnpm docpact:gate --base "$RELEASE_BASE" --head "$RELEASE_HEAD"

      - name: Verify static hotfix readiness
        if: steps.context.outputs.gate_mode == 'hotfix-full'
        run: pnpm release:static-preflight

      - name: Run full hotfix gate
        if: steps.context.outputs.gate_mode == 'hotfix-full'
        env:
          TIANGONG_AGENT_MODE: '1'
          TIANGONG_TEST_LOG_DIR: .local/test-logs/main-hotfix-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm prepush:gate

      - name: Upload full Jest logs
        if: always() && steps.context.outputs.gate_mode == 'hotfix-full'
        uses: actions/upload-artifact@v7
        with:
          name: main-hotfix-jest-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/test-logs/**
          if-no-files-found: ignore
          retention-days: 7
