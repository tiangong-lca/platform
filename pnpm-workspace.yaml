packages:
  - .

# Keep pnpm's isolated linker. These narrowly expose only Umi and Babel plugin
# dependencies that their current toolchain resolves from the project root.
publicHoistPattern:
  - '@babel/*'
  - umi

# Umi 4.7.9's published dependency metadata still points at its fallback antd 4
# and ProComponents 2 packages even though its runtime plugins support antd 6.
# Pin the reviewed native stack so pnpm installs one application UI generation.
overrides:
  '@umijs/max>antd': 6.6.2
  '@umijs/plugins>@ant-design/pro-components': 3.1.14-6
  '@umijs/preset-umi>react': 19.2.8
  '@umijs/preset-umi>react-dom': 19.2.8
  '@umijs/server>react': 19.2.8
  '@umijs/server>react-dom': 19.2.8

# pnpm 11 requires every dependency lifecycle script to be decided explicitly.
allowBuilds:
  # Both packages publish reviewed platform-native optional bindings; their fallback
  # source-build/postinstall scripts are unnecessary for the supported 64-bit matrix.
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  electron-winstaller: true
  es5-ext: false
  esbuild: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@tiangong-lca/tidas-sdk@0.3.1'
  - '@umijs/ast@4.7.9'
  - '@umijs/babel-preset-umi@4.7.9'
  - '@umijs/bundler-esbuild@4.7.9'
  - '@umijs/bundler-utils@4.7.9'
  - '@umijs/bundler-utoopack@4.7.9'
  - '@umijs/bundler-vite@4.7.9'
  - '@umijs/bundler-webpack@4.7.9'
  - '@umijs/core@4.7.9'
  - '@umijs/lint@4.7.9'
  - '@umijs/max@4.7.9'
  - '@umijs/mfsu@4.7.9'
  - '@umijs/plugin-run@4.7.9'
  - '@umijs/plugins@4.7.9'
  - '@umijs/preset-umi@4.7.9'
  - '@umijs/renderer-react@4.7.9'
  - '@umijs/server@4.7.9'
  - '@umijs/test@4.7.9'
  - '@umijs/utils@4.7.9'
  - '@umijs/zod2ts@4.7.9'
  - '@utoo/pack-darwin-arm64@1.5.13'
  - '@utoo/pack-linux-arm64-gnu@1.5.13'
  - '@utoo/pack-linux-arm64-musl@1.5.13'
  - '@utoo/pack-linux-x64-gnu@1.5.13'
  - '@utoo/pack-linux-x64-musl@1.5.13'
  - '@utoo/pack-shared@1.5.13'
  - '@utoo/pack-win32-x64-msvc@1.5.13'
  - '@utoo/pack@1.5.13'
  - umi@4.7.9
  - '@ant-design/icons-svg@4.6.0'
  - '@ant-design/icons@6.3.4'
  - electron@44.1.0
